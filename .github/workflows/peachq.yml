# Optional: not a required check.
name: tests (optional)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pq
        uses: peachq-org/setup-peachq@v1.0.0
        with:
          version: 0.92.20261116
      - shell: bash
        run: |
          sed -i 's/`help`consistency;/`help;/; s/;"tests\/runConsistency.q"//' tests/runAll.q
          $QCMD tests/runAll.q -q -classic 2>&1 | tee out.txt
          echo "**peachq ${{ steps.pq.outputs.version }}:** $(awk '$1=="passed"||$1=="failed" {printf "%s %s ", $2+0, $1}' out.txt)" >> "$GITHUB_STEP_SUMMARY"
